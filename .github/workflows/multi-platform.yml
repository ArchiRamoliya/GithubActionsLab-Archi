name: Multi Platform Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  ubuntu-job:
    name: Ubuntu Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Ubuntu Information
        run: |
          echo "Running on Ubuntu"
          uname -a

      - name: Create File on Ubuntu
        run: |
          echo "This file was created on Ubuntu" > ubuntu-file.txt
          cat ubuntu-file.txt

  windows-job:
    name: Windows Job
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Windows Information
        run: |
          echo "Running on Windows"
          systeminfo

      - name: Create File on Windows
        run: |
          echo "This file was created on Windows" > windows-file.txt
          type windows-file.txt

  macos-job:
    name: macOS Job
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print macOS Information
        run: |
          echo "Running on macOS"
          uname -a

      - name: Create File on macOS
        run: |
          echo "This file was created on macOS" > macos-file.txt
          cat macos-file.txt
